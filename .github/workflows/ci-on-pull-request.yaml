name: 'ci-on-pull-request'

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  pull-requests: write 
  id-token: write  

env:
  TF_IN_AUTOMATION: "true" # shorter output, no "run terraform apply next" hints

jobs:
  validate-examples:
    name: 'Validate ${{ matrix.dir }}'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # validating an example also validates the module it calls
        dir: [ec2, iam-role-and-policy, networking, s3-bucket]
    defaults:
      run:
        working-directory: modules/${{ matrix.dir }}/examples
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2"
      - run: terraform init -backend=false -input=false
      - run: terraform validate -no-color

  terraform-plan:
    name: 'Terraform Plan'
    runs-on: ubuntu-latest

    # one plan per pr at a time - a new push cancels the older run
    concurrency:
      group: plan-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.2" 

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -diff -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -input=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false -out=tfplan
        continue-on-error: true

      - name: Post Plan to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
        with:
          script: |
            const marker = '<!-- terraform-plan-comment -->';
            const body = `${marker}
            #### format \`${{ steps.fmt.outcome }}\`
            #### init \`${{ steps.init.outcome }}\`
            #### validate \`${{ steps.validate.outcome }}\`
            #### plan \`${{ steps.plan.outcome }}\`

            <details><summary>show plan</summary>

            \`\`\`
            ${process.env.PLAN}
            \`\`\`

            </details>`;

            // update this workflow's comment if it exists, so each pr has only one plan comment
            const { owner, repo } = context.repo;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: context.issue.number });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: context.issue.number, body });
            }

      - name: Fail Job if Plan Failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
